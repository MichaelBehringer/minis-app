<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Ministrantenplan">
  <!--
    Vorlage fuer alle App-Symbole. Das Motiv - das Kreuz der bisherigen
    Anwendung - sitzt bewusst nur im mittleren Drittel:

    Android schneidet maskierbare Symbole zu Kreisen, Quadraten oder
    Rundrechtecken zu und garantiert nur die inneren 80% des Bildes. Was
    innerhalb dieses Bereichs liegt, ueberlebt jede Maskenform - deshalb kann
    dieselbe Datei als normales und als maskierbares Symbol dienen.

    Die Farbe ist die Markenfarbe aus src/theme.js. Aendert sie sich dort,
    gehoert sie hier mit geaendert.
  -->
  <rect width="512" height="512" fill="#5c4b9c"/>

  <!-- Strahlen. Nach aussen kuerzer gehalten, damit sie im Zuschnitt nicht
       angeschnitten wirken. -->
  <g stroke="#f5c451" stroke-width="13" stroke-linecap="round" fill="none">
    <line x1="176" y1="150" x2="146" y2="118"/>
    <line x1="163" y1="176" x2="126" y2="157"/>
    <line x1="336" y1="150" x2="366" y2="118"/>
    <line x1="349" y1="176" x2="386" y2="157"/>
    <line x1="256" y1="128" x2="256" y2="94"/>
  </g>

  <!-- Kreuz. Ein Pfad statt zweier Rechtecke, damit an den Innenecken keine
       Naht entsteht. -->
  <path
    fill="#ffffff"
    d="M232 148h48a12 12 0 0 1 12 12v52h64a12 12 0 0 1 12 12v40a12 12 0 0 1-12 12h-64v130a12 12 0 0 1-12 12h-48a12 12 0 0 1-12-12V276h-64a12 12 0 0 1-12-12v-40a12 12 0 0 1 12-12h64v-52a12 12 0 0 1 12-12z"
  />
</svg>
