server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Kompression. Der Startpfad geht dadurch von rund 900 kB auf etwa 300 kB
    # ueber die Leitung - der groesste Einzelgewinn beim Laden am Handy. Die
    # bisherige Auslieferung ueber httpd hatte gar keine.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # Inhaltsgehashte Dateinamen aendern sich bei jeder Aenderung, deshalb
    # duerfen sie beliebig lange im Cache bleiben.
    location /assets/ {
        # Nur add_header, nicht zusaetzlich expires - sonst gehen zwei
        # Cache-Control-Header raus.
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Diese drei entscheiden, ob ein Update ueberhaupt ankommt. Werden sie
    # gecacht, bleibt der Nutzer auf einer alten Version haengen.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        types { } default_type application/manifest+json;
    }

    # Die alte Version verwies auf /manifest.json. Installationen von damals
    # fragen weiter diesen Pfad ab; ohne diese Regel bekaemen sie eine
    # HTML-Seite als Manifest. So uebernehmen sie beim naechsten Abruf Name,
    # Symbole und Farben der neuen Version.
    location = /manifest.json {
        alias /usr/share/nginx/html/manifest.webmanifest;
        add_header Cache-Control "no-cache";
        types { } default_type application/manifest+json;
    }

    # Selbstheilung fuer Installationen der alten Version.
    #
    # Die alte Anwendung (Create React App) lud ihre Dateien aus /static/. Diese
    # Pfade gibt es nicht mehr. Haengt bei jemandem noch die alte index.html im
    # Cache, wuerde sie ins Leere laden und einen weissen Bildschirm zeigen.
    # Statt dessen bekommt sie hier ein Skript, das Service Worker und Caches
    # abraeumt und die Seite unter neuer Adresse frisch laedt. Beim zweiten
    # Versuch in derselben Sitzung zeigt es stattdessen eine Anleitung - eine
    # Schleife wuerde die Anwendung nur unerreichbar machen.
    #
    # Der Inhalt liegt in public/legacy-reload.js, damit er lesbar und pruefbar
    # bleibt.
    location /static/ {
        add_header Cache-Control "no-store";
        try_files /legacy-reload.js =404;
    }

    location / {
        # Bewusst 404 statt index.html: die Anwendung nutzt HashRouter, alle
        # Routen stehen hinter '#'. Ein Fallback auf index.html wuerde nur
        # fehlende Dateien als HTML ausliefern - ein Skript, das HTML
        # zurueckbekommt, bricht mit einem Syntaxfehler ab.
        try_files $uri $uri/ =404;
    }
}
