server {
    listen 33333 ssl;
    http2 on;
    server_name ministranten.dynv6.net;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # Zwischenzertifikate und Sitzungswiederverwendung. Ohne das handelt jede
    # neue Verbindung den vollen Schluesselaustausch aus.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Die App liefert nur eigene Dateien aus und laedt nichts von fremden
    # Adressen. Diese Angaben kosten nichts und schliessen die haeufigsten
    # Wege, eine Seite fremd einzubetten oder ihren Typ zu erraten.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    # Die PDF-Erzeugung kann bei einem langen Zeitraum dauern.
    proxy_read_timeout 120s;

    # Ohne diese Angaben sieht das Backend als Absender immer nginx: keine
    # echte Client-Adresse im Log, und ein spaeteres Begrenzen von
    # Anmeldeversuchen pro IP waere damit unmoeglich.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location / {
        proxy_pass http://ui:80/;
    }

    location /server/ {
        proxy_pass http://server:8080/;
    }
}
